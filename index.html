<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>College Registration Form</h1>
        <p>Please fill in the details below to register.</p>

        <form>

            <!-- Personal Details -->
            <h2>Personal Details</h2>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label>Gender:</label>

            <div class="gender">
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </div>


            <!-- Academic Details -->
            <h2>Academic Details</h2>

            <label for="course">Select Course:</label>

            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="BCA">BCA</option>
                <option value="BSc">B.Sc</option>
                <option value="BCom">B.Com</option>
                <option value="BA">B.A</option>
                <option value="BE">B.E</option>
                <option value="BTech">B.Tech</option>
            </select>

            <label for="qualification">Previous Qualification:</label>
            <input type="text" id="qualification"
                   name="qualification"
                   placeholder="Example: 12th / Diploma">

            <label for="percentage">Percentage / CGPA:</label>
            <input type="number" id="percentage"
                   name="percentage"
                   placeholder="Enter your percentage"
                   step="0.01">


            <!-- Address -->
            <h2>Address Details</h2>

            <label for="address">Address:</label>
            <textarea id="address" name="address"
                      placeholder="Enter your address"
                      rows="4"></textarea>

            <label for="city">City:</label>
            <input type="text" id="city" name="city"
                   placeholder="Enter your city">

            <label for="state">State:</label>
            <input type="text" id="state" name="state"
                   placeholder="Enter your state">

            <label for="pincode">Pincode:</label>
            <input type="text" id="pincode" name="pincode"
                   placeholder="Enter your pincode">


            <!-- Account Details -->
            <h2>Account Details</h2>

            <label for="password">Password:</label>
            <input type="password" id="password"
                   name="password"
                   placeholder="Create a password"
                   required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password"
                   id="confirm-password"
                   name="confirm-password"
                   placeholder="Confirm your password"
                   required>


            <!-- Terms -->
            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>

                <label for="terms">
                    I agree to the terms and conditions.
                </label>
            </div>


            <!-- Buttons -->
            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>

        </form>

    </div>

</body>
</html>
